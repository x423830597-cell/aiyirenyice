$('.source-bar').innerHTML='<span>已选择数据源：</span><strong><span class="data-source-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></span>qar及ebt数据</strong><button type="button" class="remove-source" aria-label="移除数据源">×</button>';
$('.source-bar').hidden=false;
function cancel(){generation++;timers.forEach(clearTimeout);timers=[];$('.send').disabled=false;$('.composer textarea').disabled=false;}
function schedule(ms,fn){const token=generation;timers.push(setTimeout(()=>{if(token===generation)fn()},ms));}
function scrollEnd(){const el=$('.messages');el.scrollTop=el.scrollHeight;}
function save(){if(!activeId)return;const h=histories.find(h=>h.id===activeId);if(h)h.turns=structuredClone(turns);historyList();}
function historyList(){const filter=$('.history-search').value.trim();$('#history-list').innerHTML=histories.filter(h=>h.title.includes(filter)).map(h=>'<button class="history-item '+(h.id===activeId?'selected':'')+'" data-id="'+h.id+'" title="'+esc(h.title)+'">'+esc(h.title)+'</button>').join('');document.querySelectorAll('.history-item').forEach(b=>b.onclick=()=>{cancel();const h=histories.find(h=>h.id===b.dataset.id);activeId=h.id;turns=structuredClone(h.turns);render();historyList();});}
function reset(){cancel();turns=[];activeId=null;$('.messages').innerHTML='';document.body.classList.remove('has-answer');$('.composer textarea').value='';$('.query-status').textContent='';$('.source-bar').hidden=false;historyList();}
function model(q){
 if(/检查时间|检查结果|检查日期/.test(q)){const m=q.match(/(20\d{2})年(\d{1,2})月(\d{1,2})日/);const date=m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'2025-02-23';return {title:date.replace(/(\d{4})-(\d{2})-(\d{2})/,'$1年$2月$3日')+'后员工检查结果',headers:['姓名','员工编号','检查日期','检查结果结论'],data:checks.filter(r=>r[2].slice(0,10)>date),sql:`SELECT DISTINCT name, staff_num, checkDate, checkResult\nFROM ads_eplm_pilot_ebt_ob\nWHERE checkDate > '${date}'\nLIMIT 1000;`,summary:'识别检查日期条件，匹配员工、检查时间及检查结果结论字段，保留同一员工不同检查日期的记录。',suggestions:[example,'2025年8月，EBT检查课未达标人员有哪些？']};}
 const year=q.match(/20\d{2}/)?.[0]||'2025',fleet=q.match(/777|737|787|A320/i)?.[0]||'777',score=q.match(/(?:得分|评分)(?:为|低于)?\s*([1-5])/)?.[1]||'2';const less=q.includes('低于');const supported=/胜任力|机型组|得分/.test(q);return {title:year+'年'+fleet+'机型组'+score+'分用户列表',headers:['用户姓名','员工编号','机型组','胜任力得分'],data:supported&&year==='2025'?rows.filter(r=>r.fleet===fleet&&(less?r.score<+score:r.score===+score)).map(r=>[r.name,r.employee,r.fleet,r.score.toFixed(1)]):[],sql:`SELECT DISTINCT name AS user_name, staff_num, FLEET_CD, ability_scores\nFROM ads_eplm_pilot_ebt_ob\nWHERE str_time LIKE '${year}%'\n AND FLEET_CD = '${fleet}' AND ability_scores ${less?'<':'='} ${score}\nLIMIT 1000;`,summary:'解析年份、机型组及胜任力评分条件，自动匹配 qar及ebt数据，查询并整理为用户列表。',suggestions:[followup,'列出2025年，777机型组胜任力得分低于3分的用户及其具体得分','列出2025年，A320机型组胜任力得分为2分的用户有哪些']};
}
function querySteps(t){
 const checks=t.m.headers.includes('检查结果结论');
 const steps=checks?[
 ['识别查询条件','检查时间晚于2025-02-23，返回员工及检查结论。'],
 ['匹配数据字段','qar及ebt数据 · ads_eplm_pilot_ebt_ob；姓名、员工编号、检查日期、检查结果。'],
 ['生成查询语句',t.m.sql],
 ['整理查询结果','保留不同检查日期的记录，以表格展示，最多返回1000条。']
 ]:[
 ['识别查询条件','年份：2025年；机型组：777；胜任力得分：2分。'],
 ['匹配数据字段','qar及ebt数据 · ads_eplm_pilot_ebt_ob；name（姓名）、staff_num（员工编号）、FLEET_CD（机型组）、ability_scores（胜任力得分）。'],
 ['生成查询语句',t.m.sql],
 ['整理查询结果','按人员去重，最多返回1000条；输出用户姓名、员工编号、机型组和胜任力得分，姓名为空时显示“－”。']
 ];
 return '<ol class="query-steps">'+steps.map(([title,body],i)=>'<li '+(!t.done&&i>(t.step||0)?'hidden':'')+'><strong>'+title+'</strong>'+(i===2?'<pre>':'<p>')+esc(body)+(i===2?'</pre>':'</p>')+'</li>').join('')+'</ol>';
}
function render(){document.body.classList.toggle('has-answer',turns.length>0);$('.messages').innerHTML=turns.map((t,i)=>`<section class="query-turn" data-turn="${i}"><div class="user-message"><div class="bubble">${esc(t.q)}</div></div><div class="assistant"><div class="bot">${icon('bot')}</div><article class="answer" aria-busy="${!t.done}"><button class="thinking" aria-expanded="${!t.done}">${t.done?'思考过程':'思考中'} ${icon('chevron')}</button><div class="thought" style="display:${t.done?'none':'block'}">${querySteps(t)}</div>${t.done?resultHTML(t,i):'<div class="loading"><span class="spinner"></span><span role="status">'+esc(t.status)+'</span></div>'}</article></div></section>`).join('');
 document.querySelectorAll('.query-turn').forEach(section=>{const i=+section.dataset.turn,t=turns[i];section.querySelector('.thinking').onclick=e=>{const b=e.currentTarget,open=b.getAttribute('aria-expanded')!=='true';b.setAttribute('aria-expanded',open);section.querySelector('.thought').style.display=open?'block':'none';};section.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,t,section));section.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{ $('.composer textarea').value=b.dataset.question;$('.composer textarea').focus();});section.querySelectorAll('th button').forEach((b,col)=>b.onclick=()=>{t.sortAsc=!t.sortAsc;t.m.data.sort((a,b)=>String(a[col]).localeCompare(String(b[col]),'zh-CN',{numeric:true})*(t.sortAsc?1:-1));render();});});scrollEnd();}
function resultHTML(t,i){return `<div class="result-card"><div class="result-heading"><h3>${esc(t.m.title)}</h3><div class="result-tools"><button data-action="table" aria-label="表格视图">${icon('table')}</button><button data-action="sql" aria-label="查看SQL">${icon('sql')}</button><button data-action="export" aria-label="导出CSV">${icon('download')}</button><button data-action="expand" aria-label="放大表格">${icon('expand')}</button></div></div><div class="result-table-wrap"><table class="result-table"><thead><tr>${t.m.headers.map(h=>'<th><button>'+esc(h)+' ▾</button></th>').join('')}</tr></thead><tbody>${t.m.data.map(r=>'<tr>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')}</tbody></table>${t.m.data.length?'':'<p class="query-error">未找到符合条件的记录，请调整查询条件。</p>'}</div><div class="result-meta">共 ${t.m.data.length} 条</div></div><div class="answer-actions"><button data-action="retry">重新生成</button><button data-action="analysis">数据分析</button><button data-action="predict">数据预测</button></div><div class="suggestions"><p>继续提问：</p>${t.m.suggestions.map(q=>'<button data-question="'+esc(q)+'">'+esc(q)+'</button>').join('')}</div>`;}
function action(kind,t,section){if(kind==='sql'){ $('.dialog h3').textContent='查看SQL';$('.sql-content').textContent=t.m.sql;$('dialog').showModal();}if(kind==='expand'){const d=$('dialog');$('.dialog h3').textContent=t.m.title;$('.sql-content').innerHTML='<div class="expanded-table">'+section.querySelector('table').outerHTML+'</div>';d.showModal();}if(kind==='table'){section.querySelector('.result-table-wrap').hidden=false;}if(kind==='retry')startQuery(t.q);if(kind==='analysis'||kind==='predict'){$('.dialog h3').textContent=kind==='analysis'?'数据分析':'数据预测';$('.sql-content').textContent=kind==='analysis'?`当前查询返回 ${t.m.data.length} 条记录。`+(t.m.headers.includes('检查结果结论')?'检查结论与检查日期可用于后续复盘。':'当前结果中的胜任力得分均为2分。'):'暂无预测结果。';$('dialog').showModal();}if(kind==='export'){const cell=v=>'"'+String(v).replaceAll('"','""')+'"';const csv='\ufeff'+[t.m.headers,...t.m.data].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=t.m.title+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}}
function startQuery(q=example){cancel();if(!activeId){activeId=String(Date.now());histories.unshift({id:activeId,title:q,turns:[]});}const t={q,m:model(q),done:false,status:'正在识别提问意图…'};turns.push(t);$('.composer textarea').value='';$('.source-bar').hidden=false;$('.send').disabled=true;$('.query-status').textContent='正在查询…';render();schedule(1000,()=>{t.step=1;t.status='已匹配 qar及ebt数据，正在生成查询语句…';render();});schedule(2300,()=>{t.step=3;t.status='查询完成，正在整理结果表格…';render();});schedule(3600,()=>{t.done=true;$('.send').disabled=false;$('.query-status').textContent='查询完成';render();save();});}
function runDemo(){reset();for(let i=0;i<=example.length;i++)schedule(250+i*35,()=>$('.composer textarea').value=example.slice(0,i));schedule(1900,()=>startQuery(example));}
$('.new').onclick=reset;$('.composer').onsubmit=e=>{e.preventDefault();const q=$('.composer textarea').value.trim();if(q&&!$('.send').disabled)startQuery(q);};$('.composer textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('.composer').requestSubmit();}};$('.history-search').oninput=historyList;$('.close-dialog').onclick=()=>$('dialog').close();$('.collapse').onclick=()=>document.body.classList.toggle('nav-small');$('.menu').onclick=()=>document.body.classList.toggle('history-hidden');$('.remove-source').onclick=()=>{$('.source-bar').hidden=true;$('.query-status').textContent='下次提问时自动匹配数据源';};document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>{if(b.dataset.module==='智能问数')reset();else parent.postMessage({type:'qa-navigate',module:b.dataset.module},'*');});let playbackStage=null;
function syncResultScroll(t){
 const table=$('.result-table-wrap');if(!table)return;
 const progress=Math.max(0,Math.min(1,(t-12)/1.75));
 const eased=progress*progress*(3-2*progress);
 table.scrollTop=(table.scrollHeight-table.clientHeight)*eased;
}
function playbackAt(t){
 const stage=t<4?'idle':t<6?'type1':t<10?'think1':t<12?'result1':t<14?'scroll1':t<16?'sql1':'finish';
 if(stage===playbackStage){syncResultScroll(t);if(stage==='think1')document.querySelectorAll('.query-steps li').forEach((li,i)=>li.hidden=i>Math.min(3,Math.floor(t-6)));if(stage==='type1'||stage==='type2'){const q=stage==='type1'?example:followup,start=stage==='type1'?4:16;$('.composer textarea').value=q.slice(0,Math.floor((t-start)/2*q.length));}return;}
 playbackStage=stage;cancel();if($('dialog').open)$('dialog').close();turns=[];
 if(t>=6)turns.push({q:example,m:model(example),done:t>=10,step:Math.min(3,Math.floor(t-6)),status:'正在查询 qar及ebt数据…'});

 render();$('.composer textarea').value='';$('.source-bar').hidden=false;
 if(stage==='sql1'||stage==='sql2')action('sql',turns.at(-1),$('.query-turn:last-child'));
 syncResultScroll(t);
 $('.query-status').textContent=stage.startsWith('think')?'正在查询…':turns.length?'查询完成':'';
 $('.send').disabled=stage.startsWith('think');
}
window.dataReference={seekAt:playbackAt,reset(){playbackStage=null;reset();},runDemo,startQuery,followUp:()=>startQuery(followup),showChart:()=>{},showTable:()=>{}};reset();

</script>
